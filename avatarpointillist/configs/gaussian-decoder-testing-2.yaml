base_config: ./configs/base_config.yaml

max_img_per_gpu: 1
image_num: [1, 1]
ckpt_log_steps: 500
other_views: 16
experiment:
    child: arlam-20k-hongyu-use-ar-binding-arfeature-largeoffset-newid
data:
    dataset:
        use_aug: false
        use_ar_out: true
    subsets:
        -   name: mv_video_head
            root_dirs: "/robby/share/Avatar/wuzijian/AnyLAM/train_data/nersemble_v2/export"
            gs_dirs: "/robby/share/Avatar/hongyul/code/arartist/configs/cluster_nersamble_2_ar_out.json"
            meta_path:
                train: "/robby/share/Avatar/hongyul/code/arartist/arartist/configs/label/train_ids_new.json"
                val: "/robby/share/Avatar/hongyul/code/arartist/arartist/configs/label/val_ids.json"
            sample_rate: 1.0
    laoder:
        num_workers:
            train: 8
        shuffle: true
        pin_memory: true
        persistent_workers: true
model:
    flame_subdivide_num: 1
    gs_xyz_offset_max_step: 0.2
    use_binding_as_condion: true
    use_ar_embedding_as_condition: true
    human_model_path: "/nas5/liuhongyu/AR_Results/ners_test_data/ar_out/flame"


train:
    batch_size: 8
    optim:
        lr: 4e-4
    scheduler:
        type: cosine
        warmup_real_iters: 3000
    loss:
        ssim_weight: 0.5
val:
    batch_size: 4

